name: Nightly solve

# Snapshot tonight's package indexes -> solve every package version and pipeline environment for
# 4 platforms, split over several machines -> classify, report, save to the `results` branch,
# deploy the site. See docs/running.md.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Machines for the solve step"
        default: "8"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write       # the "Farm status" issue
  actions: write      # keep-alive: re-enable this workflow so GitHub never pauses the schedule

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  BIOARM: /home/runner/bioarm
  PYTHONUNBUFFERED: "1"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      day: ${{ steps.shards.outputs.day }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r farm/requirements.txt
      - name: Load previous results
        run: python farm/ci.py load-state
      - name: Snapshot tonight's sources and build the test plan
        run: python farm/update.py snapshot
      - id: shards
        run: |
          N="${{ inputs.shards || '8' }}"
          echo "list=$(python -c "import json;print(json.dumps(list(range(1,$N+1))))")" >> "$GITHUB_OUTPUT"
          echo "day=$(ls "$BIOARM/snapshots" | sort | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Pack state for the solve machines
        run: tar -C "$BIOARM" -czf state.tgz results.db plan.json "snapshots/${{ steps.shards.outputs.day }}"
      - uses: actions/upload-artifact@v7
        with:
          name: state
          path: state.tgz
          retention-days: 90   # also the evidence copy of tonight's raw bioconda index

  solve:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.snapshot.outputs.shards) }}
    name: solve ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r farm/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: state
      - run: mkdir -p "$BIOARM" && tar -C "$BIOARM" -xzf state.tgz
      - name: Solve this machine's share
        run: python farm/solve.py --shard ${{ matrix.shard }}/${{ strategy.job-total }} --workers 4
      - name: Pack results
        if: always()
        run: python farm/ci.py pack-shard out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: res-${{ matrix.shard }}
          path: out
          retention-days: 7

  publish:
    needs: [snapshot, solve]
    if: always() && needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r farm/requirements.txt
      - name: Load previous results and logs
        run: python farm/ci.py load-state --logs
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge tonight's results
        run: |
          # download-artifact unpacks a lone artifact straight into artifacts/ (a rerun with nothing new to solve)
          STATE=artifacts/state/state.tgz; [ -f "$STATE" ] || STATE=artifacts/state.tgz
          tar -C "$BIOARM" -xzf "$STATE"
          python farm/ci.py merge-shards artifacts/res-*
      - name: Classify, reason labels, report, build the site
        run: python farm/update.py post --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save results to the results branch
        run: python farm/ci.py save-state
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BIOARM }}/site
      # GitHub sometimes can't see the just-uploaded site for a few seconds, so a failed deploy is retried once.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the site deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Update the "Farm status" issue (a comment, which emails the owner, only when something needs attention)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --limit 50 --json number,title -q '.[] | select(.title=="Farm status") | .number' | head -1)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "Farm status" --body-file "$BIOARM/report.md" | grep -oE '[0-9]+$')
          else
            gh issue edit "$NUM" --body-file "$BIOARM/report.md"
          fi
          if [ -f "$BIOARM/alert.md" ]; then
            printf '@yuvalbloch ' | cat - "$BIOARM/alert.md" > alert.md
            gh issue comment "$NUM" --body-file alert.md
          fi
      - name: Keep the nightly schedule alive (GitHub pauses schedules after 60 days without activity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nightly.yml/enable"

  notify-failure:
    needs: [snapshot, solve, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed run on the "Farm status" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --limit 50 --json number,title -q '.[] | select(.title=="Farm status") | .number' | head -1)
          [ -z "$NUM" ] && NUM=$(gh issue create --title "Farm status" --body "Created by the nightly solve." | grep -oE '[0-9]+$')
          gh issue comment "$NUM" --body "@yuvalbloch Tonight's run had a problem: $URL (results already published stay as they are; Claude can look at the log)."
