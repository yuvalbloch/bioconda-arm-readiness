name: Weekly real-machine test

# The most-downloaded tools that the table marks ✓ on arm64 are installed for real on real
# Apple Silicon (macos-15) and arm64 Linux (ubuntu-24.04-arm) machines, and the package's own test
# (the one bioconda's CI ran) is run again. See farm/smoke.py and docs/methodology.md.
on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      top:
        description: "Tools per platform (most-downloaded first)"
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BIOARM: /home/runner/bioarm
  PYTHONUNBUFFERED: "1"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r farm/requirements.txt
      - run: python farm/ci.py load-state
      - run: python farm/classify.py
      - run: python farm/smoke.py select --top "${{ inputs.top || '300' }}" --shards 4 --out smoke-cases.json
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-cases
          path: smoke-cases.json
          retention-days: 7

  run:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: osx-arm64, runner: macos-15, mm: osx-arm64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, mm: linux-aarch64 }
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 340
    name: ${{ matrix.target.platform }} ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet PyYAML certifi
      - uses: actions/download-artifact@v8
        with:
          name: smoke-cases
      - name: Get micromamba
        run: curl -fsSL "https://micro.mamba.pm/api/micromamba/${{ matrix.target.mm }}/latest" | tar -xj bin/micromamba && ./bin/micromamba --version
      - name: Install each tool for real and run its own test
        env:
          RUNNER_LABEL: ${{ matrix.target.runner }}
        run: python farm/smoke.py run --cases smoke-cases.json --platform ${{ matrix.target.platform }} --shard ${{ matrix.shard }}/4 --micromamba "$PWD/bin/micromamba" --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smk-${{ matrix.target.platform }}-${{ matrix.shard }}
          path: out
          retention-days: 30

  publish:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: nightly          # never at the same time as the nightly run's publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet -r farm/requirements.txt
      - run: python farm/ci.py load-state --logs
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: smk-*
      - run: python farm/ci.py merge-shards artifacts/smk-*
      - run: python farm/classify.py
      - run: python farm/export.py
      - run: python farm/ci.py save-state
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BIOARM }}/site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
